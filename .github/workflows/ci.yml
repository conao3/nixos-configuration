name: NixOS Configuration CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Check NixOS Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0

      - name: Install Nix
        uses: cachix/install-nix-action@v31.11.3
        with:
          nix_path: nixpkgs=channel:nixos-unstable
          extra_nix_config: |
            experimental-features = nix-command flakes
            accept-flake-config = true

      - name: Check flake format
        run: nix fmt -- --fail-on-change .

      - name: Check NixOS configurations
        run: |
          mkdir -p /tmp/nix-flakes-ci
          printf '{ }\n' > /tmp/nix-flakes-ci/nix-flakes-registry.nix
          for name in agent-friction idea-routine; do
            mkdir -p "/tmp/nix-flakes-ci/$name"
            cat > "/tmp/nix-flakes-ci/$name/flake.nix" <<'STUB'
          {
            outputs = _: {
              packages.x86_64-linux.default = builtins.derivation {
                name = "stub";
                system = "x86_64-linux";
                builder = "/bin/sh";
                args = [ "-c" "mkdir $out" ];
              };
            };
          }
          STUB
          done
          overrides=(
            --override-input nix-flakes path:/tmp/nix-flakes-ci
            --override-input agent-friction path:/tmp/nix-flakes-ci/agent-friction
            --override-input idea-routine path:/tmp/nix-flakes-ci/idea-routine
          )
          nix build .#nixosConfigurations.conao-nixos-helios.config.system.build.toplevel --dry-run --show-trace "${overrides[@]}"
          nix build .#nixosConfigurations.conao-nixos-eos.config.system.build.toplevel --dry-run --show-trace "${overrides[@]}"
